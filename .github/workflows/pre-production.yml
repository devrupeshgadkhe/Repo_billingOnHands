name: Pre-Production Build, Beta Release and Validation

on:
  push:
    branches:
      - pre-production
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pre-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate and Build Isolated Beta Installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci || npm install

      - name: Install pinned Playwright runtime for Electron tests
        run: npm install --no-save --no-package-lock playwright@1.58.2

      - name: Set unique Beta version
        run: node scripts/set-preproduction-version.cjs ${{ github.run_number }}

      - name: Verify release channel and data isolation rules
        run: npm run test:release-channel

      - name: TypeScript validation
        run: npm run lint

      - name: Build web application and backend
        run: npm run build

      - name: Verify application icons
        run: node scripts/ensure-icons.cjs

      - name: Run Playwright Electron desktop smoke test
        run: npm run test:electron
        env:
          CI: "true"

      - name: Upload Electron test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-test-results-${{ github.run_number }}
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Build isolated Beta Windows installer
        run: npx electron-builder --win --x64 --publish never

      - name: Verify installer and generate update metadata
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist-desktop-beta" -Filter "*.exe" | Where-Object { $_.Name -notlike "*unpacked*" } | Select-Object -First 1
          if (-not $installer) { throw "Beta Windows installer was not generated." }
          if ($installer.Length -lt 10MB) { throw "Beta installer is unexpectedly small: $($installer.Length) bytes." }

          node scripts/ensure-latest-yml.cjs dist-desktop-beta
          $metadata = Join-Path "dist-desktop-beta" "latest.yml"
          if (-not (Test-Path $metadata)) { throw "Beta latest.yml was not generated." }

          $packageVersion = node -p "require('./package.json').version"
          $metadataText = Get-Content $metadata -Raw
          if ($metadataText -notmatch "(?m)^version: $([regex]::Escape($packageVersion))\s*$") {
            throw "Beta latest.yml version does not match package.json ($packageVersion)."
          }
          Write-Host "Beta installer: $($installer.Name) ($($installer.Length) bytes)"
          Write-Host "Beta package version: $packageVersion"
          Write-Host "Beta update metadata: verified"

      - name: Publish or update the rolling Beta prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "beta-latest"
          $releaseEndpoint = "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $releaseJson = gh api $releaseEndpoint 2>$null
          $releaseId = $null

          if ($LASTEXITCODE -eq 0 -and $releaseJson) {
            $release = $releaseJson | ConvertFrom-Json
            $releaseId = $release.id
            Write-Host "Updating existing Beta release ID: $releaseId"

            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$env:GITHUB_SHA" -F force=true
            if ($LASTEXITCODE -ne 0) { throw "Unable to move the rolling Beta tag to the current build." }

            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" -f name="Billing On Hand Beta" -F prerelease=true -f target_commitish="$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw "Unable to update the existing Beta release." }
          } else {
            Write-Host "No existing Beta release found. Creating it."
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "Billing On Hand Beta" --notes "Rolling Pre-Production Beta update channel. Not for production use."
            if ($LASTEXITCODE -ne 0) { throw "Unable to create the Beta prerelease." }
          }

          gh release upload $tag dist-desktop-beta/*.exe dist-desktop-beta/latest.yml --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload Beta installer and update metadata." }

          $published = gh api $releaseEndpoint
          if ($LASTEXITCODE -ne 0) { throw "Unable to verify the published Beta release." }
          $publishedRelease = $published | ConvertFrom-Json
          $requiredAssets = @("latest.yml")
          foreach ($assetName in $requiredAssets) {
            if (-not ($publishedRelease.assets | Where-Object { $_.name -eq $assetName })) {
              throw "Published Beta release is missing required asset: $assetName"
            }
          }
          Write-Host "Verified Beta release $tag (ID: $($publishedRelease.id)) and latest.yml."

      - name: Upload build artifact for manual installation and inspection
        uses: actions/upload-artifact@v4
        with:
          name: billing-on-hand-beta-${{ github.sha }}
          path: |
            dist-desktop-beta/*.exe
            dist-desktop-beta/latest.yml
          if-no-files-found: error
          retention-days: 14
