name: Build & Release Windows Electron App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Automatically Upgrade Application Version
        shell: bash
        run: |
          echo "Executing automated version upgrade..."
          node scripts/auto-version.cjs
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Next Release Version: $VERSION"
          echo "Next Release Tag: $TAG"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_TAG=$TAG" >> $GITHUB_ENV

      - name: Commit & Push Version Bump to Repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src/version.ts
          git commit -m "chore(release): auto-upgrade version to $APP_TAG [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Direct push skipped; tag release will proceed"

      - name: Ensure Git Tag Exists for Release
        shell: bash
        run: |
          echo "Tagging release with $APP_TAG..."
          git tag -f -a "$APP_TAG" -m "Release $APP_TAG"
          git push origin "$APP_TAG" --force || true

      - name: Clean Stale GitHub Release If Corrupted
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for any broken release draft for $APP_TAG"
          gh release delete "$APP_TAG" --yes || true

      - name: Build Web Application and Express Backend
        run: npm run build

      - name: Ensure Application Icons Exist
        shell: bash
        run: |
          node scripts/ensure-icons.cjs

      - name: Build and Publish Windows Executable (.exe) to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --x64 --publish always

      - name: Ensure Release is Published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing release $APP_TAG"
          gh release edit "$APP_TAG" --draft=false || true
