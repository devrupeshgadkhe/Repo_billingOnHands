name: Build & Release Windows Electron App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Determine Application Release Version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Target Release Version: $VERSION"
          echo "Target Release Tag: $TAG"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_TAG=$TAG" >> $GITHUB_ENV

      - name: Ensure Git Tag Exists for Release
        shell: bash
        run: |
          echo "Tagging release with $APP_TAG..."
          git tag -f -a "$APP_TAG" -m "Release $APP_TAG"
          git push origin "$APP_TAG" --force || true

      - name: Build Web Application and Express Backend
        run: npm run build

      - name: Ensure Application Icons Exist
        shell: bash
        run: |
          node scripts/ensure-icons.cjs

      - name: Build Windows Executable (.exe) and Release Artifacts
        run: |
          npx electron-builder --win --x64 --publish never

      - name: Ensure latest.yml Metadata Exists
        shell: bash
        run: |
          node scripts/ensure-latest-yml.cjs

      - name: Publish Release and Upload Windows Setup to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking generated desktop files in dist-desktop/:"
          ls -lh dist-desktop/

          echo "Ensuring GitHub Release exists for $APP_TAG..."
          gh release view "$APP_TAG" || gh release create "$APP_TAG" \
            --title "Billing On Hand $APP_TAG" \
            --notes "Billing On Hand $APP_TAG - Offline Retail & GST ERP Desktop Setup"

          echo "Uploading installer (.exe), blockmap, and update metadata to GitHub..."
          for file in dist-desktop/*.exe dist-desktop/*.blockmap dist-desktop/latest.yml; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              for attempt in 1 2 3; do
                if gh release upload "$APP_TAG" "$file" --clobber; then
                  echo "Successfully uploaded $file"
                  break
                else
                  echo "Upload attempt $attempt failed for $file, retrying in 5 seconds..."
                  sleep 5
                fi
              done
            fi
          done

          echo "Setting release as official and public..."
          gh release edit "$APP_TAG" --draft=false --latest || true

          echo "Final GitHub Release Assets Verification:"
          gh release view "$APP_TAG"
